name: Daily SMA Crossover Dashboard

# ---------------------------------------------------------------------------
# When does this run?
#
# GitHub Actions cron is ALWAYS in UTC, and GitHub does not guarantee it
# fires at the exact minute -- scheduled runs can be queued and delayed,
# sometimes by a while, during busy periods. So rather than try to detect
# "is it exactly 7 AM Eastern right now?" at execution time (which broke:
# a delayed run just looks like the wrong hour and skips itself forever),
# we use a single fixed UTC cron and accept the small seasonal drift:
#   - 11:00 UTC = 7:00 AM Eastern while EDT is in effect (mid-Mar to early-Nov)
#   - 11:00 UTC = 6:00 AM Eastern while EST is in effect (early-Nov to mid-Mar)
# Either way it lands comfortably before your morning check.
# ---------------------------------------------------------------------------
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}    # lets you run it on demand from the Actions tab

# The workflow needs to push the regenerated docs/index.html back to the repo.
permissions:
  contents: write

# If a run is already going, don't stack another on top of it.
concurrency:
  group: daily-crossover
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the crossover scan
        run: python crossover.py

      - name: Commit and push the updated dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --staged --quiet; then
            echo "Dashboard unchanged - nothing to commit."
          else
            git commit -m "Update dashboard - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
